title: Registry Run Key Persistence
id: 2cc1c48e-3aa5-4f33-aea1-12a0e12ee1b4
status: test
description: Detects modifications to Windows Run and RunOnce autorun keys.
author: Gustavo Ribeiro Macedo
logsource:
  product: windows
  category: registry_event
  service: sysmon
detection:
  selection:
    EventID:
      - 12
      - 13
  target:
    TargetObject|contains:
      - '\CurrentVersion\Run\'
      - '\CurrentVersion\RunOnce\'
  condition: selection and target
falsepositives:
  - Authorized installers and administrative scripts
level: high
tags:
  - attack.persistence
  - attack.t1547.001
