title: Registry Run Key Persistence
id: 2cc1c48e-3aa5-4f33-aea1-12a0e12ee1b4
status: experimental
description: Detecta alteracoes em Run Keys ou chave de laboratorio.
author: Gustavo Ribeiro Macedo
logsource:
  product: windows
  category: registry_event
  service: sysmon
detection:
  selection:
    EventID:
      - 12
      - 13
  target:
    TargetObject|contains:
      - '\CurrentVersion\Run'
      - '\EDR-LAB\'
  condition: selection and target
falsepositives:
  - Instaladores e scripts homologados
level: high
tags:
  - attack.persistence
  - attack.t1547.001
