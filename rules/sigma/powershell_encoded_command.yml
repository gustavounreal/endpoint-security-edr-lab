title: PowerShell EncodedCommand Execution
id: 4cb1efaf-c6f7-4cfe-a0cf-5f2a15be5b83
status: test
description: Detects PowerShell execution with an encoded command argument.
author: Gustavo Ribeiro Macedo
logsource:
  product: windows
  category: process_creation
  service: sysmon
detection:
  selection:
    EventID: 1
    Image|endswith: '\powershell.exe'
  encoded:
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
  condition: selection and encoded
falsepositives:
  - Authorized administrative scripts
  - Legitimate deployment tools
level: high
tags:
  - attack.execution
  - attack.t1059.001
